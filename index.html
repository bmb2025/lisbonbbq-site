    <!-- Google tag (gtag.js): a fila (dataLayer, consentimento, configs) é montada já,
         mas as bibliotecas só são descarregadas mais abaixo, fora do caminho crítico -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Google Consent Mode v2: tudo recusado até a pessoa escolher no aviso de
      // cookies (components/CookieBanner.tsx). Se já escolheu numa visita
      // anterior, a escolha guardada é aplicada aqui, antes de qualquer tag.
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied',
        analytics_storage: 'denied', functionality_storage: 'granted', security_storage: 'granted',
        wait_for_update: 500
      });
      try {
        var lbbqConsent = JSON.parse(localStorage.getItem('lbbq_consent_v1') || 'null');
        if (lbbqConsent && lbbqConsent.v === 1) {
          gtag('consent', 'update', {
            analytics_storage: lbbqConsent.analytics ? 'granted' : 'denied',
            ad_storage: lbbqConsent.marketing ? 'granted' : 'denied',
            ad_user_data: lbbqConsent.marketing ? 'granted' : 'denied',
            ad_personalization: lbbqConsent.marketing ? 'granted' : 'denied'
          });
        }
      } catch (e) {}
      gtag('set', 'ads_data_redaction', true);
      // Sem cookies de anúncios, mantém o gclid nos links internos para não perder a
      // atribuição de conversões do Google Ads.
      gtag('set', 'url_passthrough', true);
      gtag('js', new Date());

      gtag('config', 'G-5CYEYQ8563');
      gtag('config', 'AW-17958063640'); // Google Ads — medição de conversões
    </script>
    <!-- gtag.js e GTM pesam ~490 KB: descarregá-los no <head> atrasava a imagem
         principal em ligações móveis (LCP ~8 s). Carregam na primeira interação ou
         poucos segundos depois do load. Tudo o que já está na dataLayer (consentimento,
         config, eventos) é processado quando as bibliotecas chegam. As conversões
         chamam window.lbbqLoadGoogleTags() para não dependerem deste atraso. -->
    <script>
      (function () {
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          var g = document.createElement('script');
          g.async = true;
          g.src = 'https://www.googletagmanager.com/gtag/js?id=G-5CYEYQ8563';
          document.head.appendChild(g);
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var m = document.createElement('script');
          m.async = true;
          m.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-PR6VRL5T';
          document.head.appendChild(m);
        }
        window.lbbqLoadGoogleTags = load;
        function schedule() {
          ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) {
            window.addEventListener(e, load, { once: true, passive: true });
          });
          setTimeout(load, 4000);
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule);
      })();
    </script>
